interface:
  display_name: "Image2 Generation"
  short_description: "Route image generation and editing through Image2"
  default_prompt: "Use $use-image2 to create an image from my prompt."

dependencies:
  tools:
    - type: "mcp"
      value: "image2"
      description: "Local GPT Image 2 generation and editing tools"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
